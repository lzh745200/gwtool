# 静态检查门槛：既拦语法/未定义名称这类"一跑就崩"的缺陷，也守护栏类规则，
# 防止上一轮人工清理过的低级问题（未用导入、重复定义、失效 noqa…）悄悄回归。
#
# FA100/FA102：本项目 target-version = py39，但开发机可能是 3.13。若在模块级
# 或运行时求值处直接写 `X | None`（PEP 604）、`list[str]` / `dict[K, V]`
# （PEP 585）这类新式注解而不加 `from __future__ import annotations`，在麒麟
# CI 的 Python 3.9 上会于「收集/定义时」即求值而崩（本地 3.13 完全看不出来）。
# 启用后这类缺陷会被本地 `ruff check .` 当场拦下，无需等 CI 复现。
# （历史案例：test_corrector_l5.py / test_tts_probe.py 均因此加过 future 导入。）
#
# 各组规则分别守什么（每组都先做全库实测，确认误报成本可接受才开）：
#   E9    —— 语法错误 / 缩进 / 未被识别的语句（解释器直接拒绝的代码）
#   F     —— Pyflakes 全组：未定义名称(F821)、未用导入(F401)、重复定义(F811)、
#            引用未赋值的局部变量(F823)、多余 f 前缀(F541) 等。上一轮人工清理
#            过 83 处此类问题，必须留回归护栏，否则同类缺陷再次溜进仓库无人拦。
#   FA100/FA102 —— py39 下的新式注解（见上）
#   B     —— flake8-bugbear：循环控制变量未用(B007)、意外覆盖等隐患
#   RUF100 —— 失效的 `# noqa`（指向的规则早已不触发，纯噪声，会掩盖真问题）
#   PLW2901 —— 循环变量被循环体覆盖（改的是别名而非元素，逻辑静默出错）
#
# 明确**不开**的组（全库实测误报会淹没信号）：
#   E7 —— 20 处全是外观（19×E702 分号 + 1×E731 lambda 赋值），零真实缺陷
#   S  —— 1616 处，其中 1530 是 S101 assert（测试里本就要 assert）
#   PLC—— 548 处，其中 547 是 PLC0415 惰性导入（本项目按需导入是有意为之）
#   RUF（全组）—— 6388 处，其中 6314 是 RUF001-003 中文歧义字符（中文注释必然命中）
#   RUF012 —— 全库仅 4 处，**全部在测试的假对象里**（如 `instances: list = []`），
#             gwtool/ 成品代码零命中。给测试桩加 ClassVar 只增加噪声，
#             真出现"实例共享可变类属性"的缺陷时，用 B 组与测试来兜更划算。
target-version = "py39"

exclude = [
    ".convlib",     # 模型转换期依赖（torch/transformers），仅转换机使用
    ".models",      # 原始模型权重，不入库
    ".venv",
    ".venv64",
    "build",
    "dist",
    "packs",
]

[lint]
select = ["E9", "F", "FA100", "FA102", "B", "RUF100", "PLW2901"]

[lint.per-file-ignores]
# 测试里用 pytest.raises(Exception) 断言异常属可接受写法：B017 的本意是提醒
# 别用过于宽泛的异常类型，但测试场景下不值得为此改写多处断言（实测 6 处）。
"tests/*" = ["B017"]
