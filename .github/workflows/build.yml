name: Build Packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  TESS_FAST: https://github.com/tesseract-ocr/tessdata_fast/raw/main/chi_sim.traineddata

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 静态检查（ruff：语法错误/未定义名称）
        run: |
          pip install ruff
          ruff check gwtool/ scripts/ tests/

      - name: 运行测试
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q --timeout=300

      - name: 端到端自检（导入→汇编→PDF→检索→纠错→备份 全流程）
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/e2e_check.py

      - name: 安装 Tesseract OCR（内置到安装包）
        run: choco install tesseract -y --no-progress

      - name: PyInstaller 打包（参数统一于 gwtool.spec）
        run: pyinstaller --noconfirm --clean gwtool.spec

      - name: 集成 Tesseract + 中文包进产物
        shell: pwsh
        run: |
          $ts = "C:\Program Files\Tesseract-OCR"
          if (-not (Test-Path "$ts\tesseract.exe")) { throw "choco Tesseract 未安装成功" }
          New-Item -ItemType Directory -Force -Path "dist\gwtool\tesseract\tessdata" | Out-Null
          Copy-Item "$ts\tesseract.exe"  "dist\gwtool\tesseract\"
          Copy-Item "$ts\*.dll"          "dist\gwtool\tesseract\"
          Copy-Item "$ts\tessdata\eng.traineddata"  "dist\gwtool\tesseract\tessdata\"
          Copy-Item "$ts\tessdata\osd.traineddata"  "dist\gwtool\tesseract\tessdata\"
          Invoke-WebRequest -Uri $env:TESS_FAST -OutFile "dist\gwtool\tesseract\tessdata\chi_sim.traineddata"
          $chi = (Get-Item "dist\gwtool\tesseract\tessdata\chi_sim.traineddata").Length
          if ($chi -lt 1MB) { throw "chi_sim.traineddata 下载异常（$chi 字节）" }
          Write-Output "Tesseract 集成完成，chi_sim $chi 字节"

      - name: 产物冒烟校验（资源齐全 + 真实启动 + 首启动种子导入）
        run: python scripts/smoke_dist.py dist\gwtool

      - name: 生成安装程序（版本号取自 gwtool/__init__.py）
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAPP_VERSION=$(python -c "from gwtool import __version__; print(__version__)") scripts\setup_windows.iss'

      - name: 上传安装包（唯一 Windows 产物）
        uses: actions/upload-artifact@v4
        with:
          name: gwtool-windows-installer
          path: dist/gwtool_setup_win64.exe

  # ------------------------------------------------------------
  # Linux ARM64 构建（麒麟 V10 主目标）：Debian 11 容器（glibc 2.31）。
  # Tesseract 4.1 + chi_sim 从容器系统集成进安装包（glibc 与麒麟桌面一致，
  # 离线机无需任何 apt 源）。构建矩阵收敛为 arm64 —— 唯一 Linux 交付目标。
  # ------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:11
    steps:
      - name: 安装构建工具链（Python 3.9 + Qt 运行库 + Tesseract OCR）
        run: |
          # bullseye-security 池被上游逐步清理（.deb 随机 404），在线源不可复现：
          # 固定到 snapshot.debian.org 时间戳快照（2026-06-01 时点安全包完整）。
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates
          echo 'deb [trusted=yes] https://snapshot.debian.org/archive/debian/20260601T000000Z/ bullseye main' > /etc/apt/sources.list
          echo 'deb [trusted=yes] https://snapshot.debian.org/archive/debian-security/20260601T000000Z/ bullseye-security main' >> /etc/apt/sources.list
          echo 'Acquire::Retries "5";' > /etc/apt/apt.conf.d/80-retries
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/81-no-valid-until
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pip git file binutils libpython3.9 \
            libgl1 libegl1 libglib2.0-0 libfontconfig1 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 libx11-6 libx11-xcb1 libxcb1 \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-render0 \
            libxcb-shape0 libxcb-randr0 libxcb-xfixes0 libxcb-glx0 \
            libxext6 libxrender1 libsm6 libice6 \
            tesseract-ocr tesseract-ocr-chi-sim patchelf
          echo "== Python 诊断 =="
          python3 --version
          tesseract --version | head -1

      - uses: actions/checkout@v4

      - name: 解析 Python 解释器（绝对路径，规避 PATH 差异）
        run: |
          PY=""
          for c in python3.9 python3 /usr/bin/python3; do
            if command -v "$c" >/dev/null 2>&1; then PY="$(command -v "$c")"; break; fi
          done
          if [ -z "$PY" ]; then
            echo "错误：容器内未找到 Python 3"
            exit 1
          fi
          echo "使用解释器：$PY"
          "$PY" --version
          echo "PYBIN=$PY" >> "$GITHUB_ENV"

      - name: 安装依赖
        run: |
          "$PYBIN" -m pip install --upgrade pip
          "$PYBIN" -m pip install "PySide6==6.8.0.2" -r requirements.txt ruff

      - name: 静态检查（ruff）
        run: ruff check gwtool/ scripts/ tests/

      - name: 运行测试
        env:
          QT_QPA_PLATFORM: offscreen
        run: $PYBIN -m pytest tests/ -q --timeout=300

      - name: 端到端自检（导入→汇编→PDF→检索→纠错→备份 全流程）
        env:
          QT_QPA_PLATFORM: offscreen
        run: $PYBIN scripts/e2e_check.py

      - name: PyInstaller 打包（glibc 2.31 目标，参数统一于 gwtool.spec）
        run: $PYBIN -m PyInstaller --noconfirm --clean gwtool.spec

      - name: 整理产物目录 + 集成 Tesseract/中文包
        run: |
          mkdir -p pkgsrc
          mv dist/gwtool pkgsrc/gwtool
          cp scripts/gwtool.sh pkgsrc/gwtool/gwtool.sh
          chmod +x pkgsrc/gwtool/gwtool pkgsrc/gwtool/gwtool.sh
          # 集成 Tesseract：二进制 + 全部非基础依赖库 + 中文包（含 RPATH）
          mkdir -p pkgsrc/gwtool/ocr/bin pkgsrc/gwtool/ocr/lib pkgsrc/gwtool/ocr/tessdata
          cp /usr/bin/tesseract pkgsrc/gwtool/ocr/bin/
          ldd /usr/bin/tesseract | awk '/=> \//{print $3}' | while read -r lib; do
            case "$lib" in
              */libc.so*|*/libm.so*|*/libpthread*|*/libdl*|*/librt*|*/ld-linux*) ;;
              *) cp -L "$lib" pkgsrc/gwtool/ocr/lib/ ;;
            esac
          done
          cp -r /usr/share/tesseract-ocr/*/tessdata/. pkgsrc/gwtool/ocr/tessdata/
          patchelf --set-rpath '$ORIGIN/../lib' pkgsrc/gwtool/ocr/bin/tesseract
          pkgsrc/gwtool/ocr/bin/tesseract --version | head -1
          pkgsrc/gwtool/ocr/bin/tesseract --list-langs | grep -q chi_sim

      - name: 自检运行库（缺库即失败，问题在发布前暴露）
        run: |
          MISSING=""
          for target in pkgsrc/gwtool/gwtool $(find pkgsrc/gwtool -name 'libqxcb.so' 2>/dev/null); do
            MISSING="$MISSING$(ldd "$target" 2>/dev/null | grep 'not found' || true)"
          done
          FILTERED=$(echo "$MISSING" | grep -v 'libxcb-cursor' || true)
          if [ -n "$FILTERED" ]; then
            echo "以下系统库在打包环境缺失（成品将同样缺失，属致命问题）："
            echo "$FILTERED"
            exit 1
          fi
          echo "运行库自检通过"

      - name: 产物冒烟校验（资源齐全 + 真实启动 + 首启动种子导入 + OCR）
        env:
          QT_QPA_PLATFORM: offscreen
        run: $PYBIN scripts/smoke_dist.py pkgsrc/gwtool

      - name: 记录版本号
        run: $PYBIN -c "from gwtool import __version__; open('pkgsrc/VERSION.txt','w').write(__version__)"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: gwtool-linux-arm64
          path: pkgsrc

  # ------------------------------------------------------------
  # .deb 组装（宿主机 dpkg-deb）：唯一 Linux 安装包
  # ------------------------------------------------------------
  package-linux:
    runs-on: ubuntu-24.04-arm
    needs: build-linux
    steps:
      - uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: gwtool-linux-arm64

      - name: 还原可执行权限并读取版本号
        run: |
          chmod +x gwtool/gwtool gwtool/gwtool.sh gwtool/ocr/bin/tesseract
          echo "VERSION=$(cat VERSION.txt)" >> "$GITHUB_ENV"

      - name: 组装 .deb 安装包（麒麟 V10 / Debian 系）
        run: |
          mkdir -p pkg/DEBIAN pkg/opt/gwtool pkg/usr/share/applications
          cp -r gwtool/. pkg/opt/gwtool/
          INSTALLED_SIZE=$(du -sk pkg/opt | cut -f1)
          cat > pkg/DEBIAN/control <<EOF
          Package: gwtool
          Version: ${VERSION}
          Section: office
          Priority: optional
          Architecture: arm64
          Installed-Size: ${INSTALLED_SIZE}
          Maintainer: lzh745200 <lzh745200@users.noreply.github.com>
          Depends: libgl1, libegl1, libglib2.0-0, libglx0, libxcb-glx0, libxkbcommon0, libxkbcommon-x11-0, libfontconfig1, libdbus-1-3, libx11-6, libx11-xcb1, libxcb1, libxcb-cursor0, libxcb-xinerama0, libxcb-icccm4, libxcb-image0, libxcb-keysyms1, libxcb-render-util0, libxcb-render0, libxcb-shape0, libxcb-randr0, libxcb-xfixes0, libxcb-xkb1, libxext6, libxrender1, libsm6, libice6
          Description: 公文汇编助手 - 单机离线版智能公文汇编与写作辅助工具
           多格式材料导入（含 WPS/扫描件 OCR 内置）、一键汇编（红头/目录/页码）、
           文字纠错、GB/T 9704 格式体检、A3骑马钉小册子、全文检索、写作参考。
           OCR 引擎与中文包已内置，离线机开箱即用。
          EOF
          cat > pkg/DEBIAN/postinst <<'EOS'
          #!/bin/sh
          # artifact 传输可能丢失可执行位，这里统一兜底
          chmod +x /opt/gwtool/gwtool /opt/gwtool/gwtool.sh /opt/gwtool/ocr/bin/tesseract 2>/dev/null || true
          exit 0
          EOS
          chmod 755 pkg/DEBIAN/postinst
          cat > pkg/usr/share/applications/gwtool.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=公文汇编助手
          Comment=单机离线版智能公文汇编与写作辅助工具
          Exec=/opt/gwtool/gwtool.sh
          Path=/opt/gwtool
          Icon=applications-office
          Terminal=false
          Categories=Office;
          EOF
          dpkg-deb --build --root-owner-group pkg "gwtool_${VERSION}_linux_arm64.deb"
          dpkg-deb -I "gwtool_${VERSION}_linux_arm64.deb" | head -12

      - name: 上传安装包（唯一 Linux 产物）
        uses: actions/upload-artifact@v4
        with:
          name: gwtool-linux-installer
          path: gwtool_*_linux_arm64.deb

  release:
    runs-on: ubuntu-latest
    needs: [build-windows, package-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 创建 GitHub Release 并附安装包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "公文汇编助手 $GITHUB_REF_NAME" \
            --generate-notes \
            artifacts/gwtool-windows-installer/* \
            artifacts/gwtool-linux-installer/*
