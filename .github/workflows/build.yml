name: Build Packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  TESS_FAST: https://github.com/tesseract-ocr/tessdata_fast/raw/main/chi_sim.traineddata

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 记录依赖快照（N12）
        shell: pwsh
        run: |
          # 直接依赖已分档（PySide6 按平台、其余按 Python 版本），但**传递依赖**
          # 仍由各平台各自解析：同一份 requirements.txt 在 Windows/py3.11 与
          # Debian11/py3.9 上装到的小版本并不相同，而全仓此前没有任何 lock 文件。
          # 这里把"实际装成的版本集合"随构建产物存档：出问题时能追溯当时到底
          # 装了什么，复查时再对比两平台差异并在 requirements.txt 里按需加约束。
          New-Item -ItemType Directory -Force artifacts | Out-Null
          pip freeze | Out-File -Encoding utf8 artifacts/requirements-locked-windows.txt
          Write-Output "依赖快照行数：$((Get-Content artifacts/requirements-locked-windows.txt).Count)"

      - name: 静态检查（ruff：语法错误/未定义名称）
        run: |
          # 锁死 ruff 版本：不锁的话 CI 每次装 latest，而 ruff 的规则默认集合与
          # 语义会随版本变化 —— 同一份源码会出现"本地绿、CI 红"（本项目已反复
          # 踩过此坑）。本地 venv 实测为 0.16.5，CI 必须与本地同版。
          pip install ruff==0.16.5
          # 与本地门禁同口径：本地跑 `ruff check .`（含入口 main.py），
          # 这里若漏掉 main.py 就会出现"本地红、CI 绿"的标准不一致。
          ruff check gwtool/ scripts/ tests/ main.py

      - name: 构建脚本护栏（行尾 + 批处理语法）
        shell: pwsh
        run: |
          # .bat 必须是 CRLF：cmd.exe 在 CP936 下按字节解码 UTF-8 中文会错位，
          # LF 的 .bat 会被整段拆错行（scripts\build_windows.bat 曾因此完全不可用）。
          $bad = @()
          Get-ChildItem scripts -Filter *.bat | ForEach-Object {
            $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
            $lf = ($bytes | Where-Object { $_ -eq 10 }).Count
            $cr = ($bytes | Where-Object { $_ -eq 13 }).Count
            if ($lf -ne $cr) { $bad += "$($_.Name) 不是 CRLF（CR=$cr LF=$lf）" }
          }
          if ($bad) { $bad | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Output "批处理脚本行尾检查通过（CRLF）"

      # 必须在「运行测试」之前装 Tesseract 且**带中文包**：choco 的 tesseract
      # 只带 eng/osd，而 tests/test_ocr_probe.py::test_has_chi_sim_real 会真跑
      # `tesseract --list-langs` 断言里面有 chi_sim —— 缺包时该用例失败
      # （CI 曾因此红，而本地因为装了中文包一直是绿的）。
      # 打包阶段后面还会用同一份 tessdata，这里装到系统目录即可复用。
      - name: 安装 Tesseract OCR + 中文包（供测试 + 打包内置）
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $ts = "C:\Program Files\Tesseract-OCR"
          if (-not (Test-Path "$ts\tesseract.exe")) { throw "choco Tesseract 未安装成功" }
          # 与打包阶段同源（tessdata_fast），避免"测试用一份、交付用另一份"
          Invoke-WebRequest -Uri $env:TESS_FAST -OutFile "$ts\tessdata\chi_sim.traineddata"
          $chi = (Get-Item "$ts\tessdata\chi_sim.traineddata").Length
          if ($chi -lt 1MB) { throw "chi_sim.traineddata 下载异常（$chi 字节）" }
          $langs = & "$ts\tesseract.exe" --list-langs 2>&1 | Out-String
          if ($langs -notmatch "chi_sim") { throw "tesseract 未识别到 chi_sim：$langs" }
          Write-Output "Tesseract 就绪，chi_sim $chi 字节"

      - name: 运行测试
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: python -m pytest tests/ -q --timeout=300

      - name: 端到端自检（导入→汇编→PDF→检索→纠错→备份 全流程）
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/e2e_check.py

      # 与 Linux job 对齐：可选推理栈必须装进打包环境，否则 Windows 产物同样
      # 只带三级流水线 —— L4/L5 代码在、依赖不在 = 功能不可达。
      # 这里同样"装完即断言"，不做静默降级：x64/py3.11 有 onnxruntime 1.27.0 的
      # 官方轮子，装不上说明环境真出了问题，应当让构建红掉而不是悄悄少一块功能。
      - name: 安装可选推理栈（L4/L5 精度增强；x64 必须真装成）
        shell: pwsh
        run: |
          python -m pip install -r requirements-optional.txt
          # 抽成脚本而非内联断言：Windows 与 ARM64 共用同一份判定逻辑，
          # 也便于本机复跑（python scripts/check_inference_stack.py）。
          python scripts/check_inference_stack.py

      - name: PyInstaller 打包（参数统一于 gwtool.spec）
        run: pyinstaller --noconfirm --clean gwtool.spec

      - name: 集成 Tesseract + 中文包进产物
        shell: pwsh
        run: |
          # 安装步骤已在测试前完成（含 chi_sim），这里只做拷贝，
          # 保证"测试验证的引擎"与"打进包里的引擎"是同一份。
          $ts = "C:\Program Files\Tesseract-OCR"
          if (-not (Test-Path "$ts\tesseract.exe")) { throw "未找到 Tesseract" }
          New-Item -ItemType Directory -Force -Path "dist\gwtool\tesseract\tessdata" | Out-Null
          Copy-Item "$ts\tesseract.exe"  "dist\gwtool\tesseract\"
          Copy-Item "$ts\*.dll"          "dist\gwtool\tesseract\"
          Copy-Item "$ts\tessdata\eng.traineddata"  "dist\gwtool\tesseract\tessdata\"
          Copy-Item "$ts\tessdata\osd.traineddata"  "dist\gwtool\tesseract\tessdata\"
          Copy-Item "$ts\tessdata\chi_sim.traineddata" "dist\gwtool\tesseract\tessdata\"
          $chi = (Get-Item "dist\gwtool\tesseract\tessdata\chi_sim.traineddata").Length
          if ($chi -lt 1MB) { throw "chi_sim.traineddata 异常（$chi 字节）" }
          Write-Output "Tesseract 集成完成，chi_sim $chi 字节"

      - name: 产物冒烟校验（资源齐全 + 真实启动 + 首启动种子导入）
        run: python scripts/smoke_dist.py dist\gwtool

      - name: 生成安装程序（版本号取自 gwtool/__init__.py）
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAPP_VERSION=$(python -c "from gwtool import __version__; print(__version__)") scripts\setup_windows.iss'

      - name: 上传安装包（唯一 Windows 产物）
        uses: actions/upload-artifact@v4
        with:
          name: gwtool-windows-installer
          path: dist/gwtool_setup_win64.exe

      - name: 上传依赖快照（N12）
        uses: actions/upload-artifact@v4
        with:
          name: requirements-locked-windows
          path: artifacts/requirements-locked-windows.txt
          if-no-files-found: error

  # ------------------------------------------------------------
  # Linux ARM64 构建（麒麟 V10 主目标）：Debian 11 容器（glibc 2.31）。
  # Tesseract 4.1 + chi_sim 从容器系统集成进安装包（glibc 与麒麟桌面一致，
  # 离线机无需任何 apt 源）。构建矩阵收敛为 arm64 —— 唯一 Linux 交付目标。
  # ------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:11
    steps:
      - name: 安装构建工具链（Python 3.9 + Qt 运行库 + Tesseract OCR）
        run: |
          # Debian 11 已 EOL，两个坑叠在一起（2026-09-16 实测，连续两次 CI 失败）：
          #   ① bullseye-security 池中的 .deb 被上游撤下 → 在线源随机 404；
          #   ② debian:11 官方镜像**不含 ca-certificates**，而 https 源需要它 →
          #      若先切 https 源再装证书，会卡在"要证书才能连源、要连源才能装证书"
          #      的鸡生蛋问题上。
          #
          # 解法：两个源**都用 HTTP**（实测 archive 与 snapshot 均支持 HTTP，
          # 配合 [trusted=yes] 跳过 GPG），于是完全不需要证书，一次装完即可。
          # 另注意：archive.debian.org **没有** debian-security 路径（实测 404），
          # 所以 bullseye-security 走 snapshot 的时间戳快照（固定内容、可复现），
          # 主包走 archive（bullseye 已 EOL，内容冻结）。
          echo 'deb [trusted=yes] http://archive.debian.org/debian bullseye main' > /etc/apt/sources.list
          echo 'deb [trusted=yes] http://snapshot.debian.org/archive/debian-security/20260601T000000Z/ bullseye-security main' >> /etc/apt/sources.list
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/81-no-valid-until
          echo 'Acquire::Retries "5";' > /etc/apt/apt.conf.d/80-retries
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates openssl python3 python3-pip git file binutils libpython3.9 \
            libgl1 libegl1 libglib2.0-0 libfontconfig1 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 libx11-6 libx11-xcb1 libxcb1 \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-render0 \
            libxcb-shape0 libxcb-randr0 libxcb-xfixes0 libxcb-glx0 \
            libxext6 libxrender1 libsm6 libice6 \
            tesseract-ocr tesseract-ocr-chi-sim patchelf
          echo "== Python 诊断 =="
          python3 --version
          tesseract --version | head -1

      - uses: actions/checkout@v4

      - name: 解析 Python 解释器（绝对路径，规避 PATH 差异）
        run: |
          PY=""
          for c in python3.9 python3 /usr/bin/python3; do
            if command -v "$c" >/dev/null 2>&1; then PY="$(command -v "$c")"; break; fi
          done
          if [ -z "$PY" ]; then
            echo "错误：容器内未找到 Python 3"
            exit 1
          fi
          echo "使用解释器：$PY"
          "$PY" --version
          echo "PYBIN=$PY" >> "$GITHUB_ENV"

      - name: 安装依赖
        run: |
          "$PYBIN" -m pip install --upgrade pip
          "$PYBIN" -m pip install "PySide6==6.8.0.2" -r requirements.txt ruff==0.16.5

      - name: 记录依赖快照（N12）
        run: |
          # 与 Windows job 对称：两平台各存一份实际依赖集，便于对比传递依赖漂移。
          # 特意放在 pkgsrc **之外** —— 那个目录是 .deb 的载荷树，塞进去会把
          # 一份开发用清单打进安装包。
          mkdir -p artifacts
          "$PYBIN" -m pip freeze > artifacts/requirements-locked-linux-arm64.txt
          echo "依赖快照行数：$(wc -l < artifacts/requirements-locked-linux-arm64.txt)"

      - name: 静态检查（ruff）
        run: ruff check gwtool/ scripts/ tests/ main.py

      - name: Shell 脚本护栏（语法 + 行尾）
        shell: bash
        run: |
          # .sh 必须是 LF：CRLF 会让 shebang 变成 `#!/usr/bin/env bash\r`，
          # 直接执行报 "env: 'bash\r': No such file or directory"；
          # scripts/gwtool.sh 是 deb 的桌面入口（Exec=/opt/gwtool/gwtool.sh），
          # CRLF 会让安装后"双击没反应"，而下面的自检只跑 gwtool 本体、
          # 从不执行它 —— 所以必须在这里显式守住。
          #
          # 显式写 shell: bash：容器 job 的默认 shell 是 `sh -e`，
          # 而 sh 不认 $'\r' 这种 ANSI-C 引用（会被当成字面量 `\r`），
          # 于是"没有 CR 的文件"也会被 grep 命中并误报（CI 已踩过）。
          fail=0
          for f in scripts/*.sh; do
            if grep -qU "$(printf '\r')" "$f"; then
              echo "错误：$f 含 CR 字符（CRLF 行尾），Linux 下无法执行"
              fail=1
            fi
            # 语法用 POSIX sh 校验：麒麟最小安装不保证有 bash，
            # 而这些脚本的 shebang 是 #!/bin/bash，交 posix 模式会误报
            if ! bash -n "$f"; then
              echo "错误：$f 语法检查未通过"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "Shell 脚本检查通过（LF + 语法正确）"

      - name: 运行测试
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: $PYBIN -m pytest tests/ -q --timeout=300

      - name: 端到端自检（导入→汇编→PDF→检索→纠错→备份 全流程）
        env:
          QT_QPA_PLATFORM: offscreen
        run: $PYBIN scripts/e2e_check.py

      # 与 Windows job 一致：把可选推理栈装进打包环境（放在测试之后），
      # 让产物带 onnxruntime+numpy，L4/L5 才可能开启。
      #
      # 曾经这一步是 `pip install ... || echo warning` —— aarch64 装不上也**不报错**，
      # 于是"麒麟 ARM64 是否具备 L4/L5"长期是个未知量：产物看似正常，功能却可能
      # 永久不可达。现已实测确认 aarch64 轮子齐备（onnxruntime 1.17.3 / tokenizers
      # 0.15.2 的 cp39 轮子均为 manylinux_2_17~2_28，glibc 基线低于本项目 2.31 底线），
      # 因此把"降级"改成"断言"：装完必须真的能 import，否则让构建**失败**。
      # 这样 ARM64 完整性从"未验证"变成"被 CI 守护的属性"。
      - name: 安装可选推理栈（L4/L5 精度增强；aarch64 必须真装成）
        run: |
          "$PYBIN" -m pip install -r requirements-optional.txt
          "$PYBIN" scripts/check_inference_stack.py

      - name: PyInstaller 打包（glibc 2.31 目标，参数统一于 gwtool.spec）
        run: $PYBIN -m PyInstaller --noconfirm --clean gwtool.spec

      - name: 整理产物目录 + 集成 Tesseract/中文包
        run: |
          mkdir -p pkgsrc
          mv dist/gwtool pkgsrc/gwtool
          cp scripts/gwtool.sh pkgsrc/gwtool/gwtool.sh
          chmod +x pkgsrc/gwtool/gwtool pkgsrc/gwtool/gwtool.sh
          # 集成 Tesseract：二进制 + 全部非基础依赖库 + 中文包（含 RPATH）
          mkdir -p pkgsrc/gwtool/ocr/bin pkgsrc/gwtool/ocr/lib pkgsrc/gwtool/ocr/tessdata
          cp /usr/bin/tesseract pkgsrc/gwtool/ocr/bin/
          ldd /usr/bin/tesseract | awk '/=> \//{print $3}' | while read -r lib; do
            case "$lib" in
              */libc.so*|*/libm.so*|*/libpthread*|*/libdl*|*/librt*|*/ld-linux*) ;;
              *) cp -L "$lib" pkgsrc/gwtool/ocr/lib/ ;;
            esac
          done
          cp -r /usr/share/tesseract-ocr/*/tessdata/. pkgsrc/gwtool/ocr/tessdata/
          patchelf --set-rpath '$ORIGIN/../lib' pkgsrc/gwtool/ocr/bin/tesseract
          pkgsrc/gwtool/ocr/bin/tesseract --version | head -1
          pkgsrc/gwtool/ocr/bin/tesseract --list-langs | grep -q chi_sim

      - name: 自检运行库（缺库即失败，问题在发布前暴露）
        run: |
          MISSING=""
          for target in pkgsrc/gwtool/gwtool $(find pkgsrc/gwtool -name 'libqxcb.so' 2>/dev/null); do
            MISSING="$MISSING$(ldd "$target" 2>/dev/null | grep 'not found' || true)"
          done
          FILTERED=$(echo "$MISSING" | grep -v 'libxcb-cursor' || true)
          if [ -n "$FILTERED" ]; then
            echo "以下系统库在打包环境缺失（成品将同样缺失，属致命问题）："
            echo "$FILTERED"
            exit 1
          fi
          echo "运行库自检通过"

      - name: 产物冒烟校验（资源齐全 + 真实启动 + 首启动种子导入 + OCR）
        env:
          QT_QPA_PLATFORM: offscreen
        run: $PYBIN scripts/smoke_dist.py pkgsrc/gwtool

      - name: 记录版本号
        run: $PYBIN -c "from gwtool import __version__; open('pkgsrc/VERSION.txt','w').write(__version__)"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: gwtool-linux-arm64
          path: pkgsrc

      - name: 上传依赖快照（N12）
        uses: actions/upload-artifact@v4
        with:
          name: requirements-locked-linux-arm64
          path: artifacts/requirements-locked-linux-arm64.txt
          if-no-files-found: error

  # ------------------------------------------------------------
  # .deb 组装（宿主机 dpkg-deb）：唯一 Linux 安装包
  # ------------------------------------------------------------
  package-linux:
    runs-on: ubuntu-24.04-arm
    needs: build-linux
    steps:
      - uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: gwtool-linux-arm64

      - name: 还原可执行权限并读取版本号
        run: |
          chmod +x gwtool/gwtool gwtool/gwtool.sh gwtool/ocr/bin/tesseract
          echo "VERSION=$(cat VERSION.txt)" >> "$GITHUB_ENV"

      - name: 组装 .deb 安装包（麒麟 V10 / Debian 系）
        run: |
          mkdir -p pkg/DEBIAN pkg/opt/gwtool pkg/usr/share/applications
          cp -r gwtool/. pkg/opt/gwtool/
          INSTALLED_SIZE=$(du -sk pkg/opt | cut -f1)
          cat > pkg/DEBIAN/control <<EOF
          Package: gwtool
          Version: ${VERSION}
          Section: office
          Priority: optional
          Architecture: arm64
          Installed-Size: ${INSTALLED_SIZE}
          Maintainer: lzh745200 <lzh745200@users.noreply.github.com>
          Depends: libgl1, libegl1, libglib2.0-0, libglx0, libxcb-glx0, libxkbcommon0, libxkbcommon-x11-0, libfontconfig1, libdbus-1-3, libx11-6, libx11-xcb1, libxcb1, libxcb-cursor0, libxcb-xinerama0, libxcb-icccm4, libxcb-image0, libxcb-keysyms1, libxcb-render-util0, libxcb-render0, libxcb-shape0, libxcb-randr0, libxcb-xfixes0, libxcb-xkb1, libxext6, libxrender1, libsm6, libice6
          Description: 公文汇编助手 - 单机离线版智能公文汇编与写作辅助工具
           多格式材料导入（含 WPS/扫描件 OCR 内置）、一键汇编（红头/目录/页码）、
           文字纠错、GB/T 9704 格式体检、A3骑马钉小册子、全文检索、写作参考。
           OCR 引擎与中文包已内置，离线机开箱即用。
          EOF
          cat > pkg/DEBIAN/postinst <<'EOS'
          #!/bin/sh
          # artifact 传输可能丢失可执行位，这里统一兜底
          chmod +x /opt/gwtool/gwtool /opt/gwtool/gwtool.sh /opt/gwtool/ocr/bin/tesseract 2>/dev/null || true
          exit 0
          EOS
          chmod 755 pkg/DEBIAN/postinst
          cat > pkg/usr/share/applications/gwtool.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=公文汇编助手
          Comment=单机离线版智能公文汇编与写作辅助工具
          Exec=/opt/gwtool/gwtool.sh
          Path=/opt/gwtool
          Icon=applications-office
          Terminal=false
          Categories=Office;
          EOF
          dpkg-deb --build --root-owner-group pkg "gwtool_${VERSION}_linux_arm64.deb"
          dpkg-deb -I "gwtool_${VERSION}_linux_arm64.deb" | head -12
          # 内容断言：控制信息对不代表文件真的进包了。少任何一项，
          # 用户装完就是"点了没反应"或"没有 OCR"。
          LIST="$(dpkg-deb -c "gwtool_${VERSION}_linux_arm64.deb")"
          for need in 'opt/gwtool/gwtool$' 'opt/gwtool/gwtool.sh$' \
                      'opt/gwtool/ocr/bin/tesseract$' \
                      'opt/gwtool/ocr/tessdata/chi_sim.traineddata$' \
                      'usr/share/applications/gwtool.desktop$'; do
            if ! echo "$LIST" | grep -qE "$need"; then
              echo "错误：deb 内缺少 $need"
              exit 1
            fi
          done
          # 推理栈（L4/L5）同样必须落到**最终交付物**里。
          # smoke_dist 断言的是 pkgsrc/gwtool（build-linux 的中间产物），
          # 而 .deb 是 `cp -r` 复制过去再打包的——复制或打包环节漏文件时，
          # 中间产物检查会全绿、用户装到的 deb 却缺推理栈。
          # 这是"最后一公里"的静默功能缺失，故在 deb 上再断言一次。
          for need in 'onnxruntime' 'tokenizers'; do
            if ! echo "$LIST" | grep -q "$need"; then
              echo "错误：deb 内缺少推理栈组件 $need —— 麒麟 ARM64 上 L4/L5 将不可启用"
              exit 1
            fi
          done
          echo "deb 内容断言通过（含推理栈）"

      - name: 上传安装包（唯一 Linux 产物）
        uses: actions/upload-artifact@v4
        with:
          name: gwtool-linux-installer
          path: gwtool_*_linux_arm64.deb

  release:
    runs-on: ubuntu-latest
    needs: [build-windows, package-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 创建 GitHub Release 并附安装包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 幂等：同一 tag 重跑（或 Release 已手工建过）时 upload --clobber，
          # 而不是让 gh release create 因 "already exists" 整条失败。
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release 已存在，改为覆盖上传产物"
            gh release upload "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" --clobber \
              artifacts/gwtool-windows-installer/* \
              artifacts/gwtool-linux-installer/*
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "公文汇编助手 $GITHUB_REF_NAME" \
              --generate-notes \
              artifacts/gwtool-windows-installer/* \
              artifacts/gwtool-linux-installer/*
          fi
